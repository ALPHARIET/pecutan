<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pecutan test</title>
<style>
  body { font-family: system-ui; background: #212121; color: #ececec; margin: 0; height: 100vh; display: grid; place-items: center; }
  .box { background: #303030; padding: 24px; border-radius: 16px; width: 420px; }
  button { padding: 8px 16px; border-radius: 999px; border: 0; background: #fff; color: #000; cursor: pointer; }
</style>
<script>
  // Stub chrome.storage untuk menguji content.js di luar extension.
  const store = { enabled: true, muted: false, count: 0 };
  const listeners = [];
  window.chrome = { storage: {
    local: {
      get(defs, cb) { cb(Object.assign({}, defs, store)); },
      set(obj) { const ch = {}; for (const k in obj) { ch[k] = { newValue: obj[k] }; store[k] = obj[k]; } listeners.forEach(l => l(ch, 'local')); document.getElementById('count').textContent = store.count; },
    },
    onChanged: { addListener(l) { listeners.push(l); } },
  } };
</script>
</head>
<body>
  <div class="box">
    <p>Halaman uji Pecutan. Klik tombol harus tetap berfungsi.</p>
    <button id="send" onclick="this.textContent='Terkirim ' + (++window.n || (window.n = 1))">Send</button>
    <p>Hitungan: <span id="count">0</span></p>
  </div>
  <script src="../content.js"></script>
</body>
</html>
