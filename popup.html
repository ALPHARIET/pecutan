<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Pecutan</title>
  <style>
    :root {
      --bg: #fbf8f3;
      --surface: #ffffff;
      --border: #e8e0d4;
      --text: #2b1d12;
      --muted: #7d6a58;
      --accent: #c27a2c;
      --track: #d9cfc2;
      --kbd-bg: #f2ebe1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1713;
        --surface: #26201a;
        --border: #3a3027;
        --text: #f3e9dc;
        --muted: #a8968a;
        --accent: #e09a4a;
        --track: #4a3f35;
        --kbd-bg: #332a22;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 272px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 32px; height: 32px; }
    h1 { margin: 0; font-size: 16px; }
    .sub { margin: 0; color: var(--muted); font-size: 12px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 12px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
    }
    .row + .row { border-top: 1px solid var(--border); }
    .switch { position: relative; width: 36px; height: 20px; flex: none; }
    .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .switch span {
      position: absolute; inset: 0; border-radius: 999px;
      background: var(--track); transition: background .15s; pointer-events: none;
    }
    .switch span::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; transition: transform .15s;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .stat { padding: 12px; display: flex; align-items: flex-end; justify-content: space-between; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
    button.link {
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--accent); font: inherit; font-size: 12px;
    }
    button.link:hover { text-decoration: underline; }
    footer { color: var(--muted); font-size: 12px; }
    footer p { margin: 6px 0; }
    kbd {
      background: var(--kbd-bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 0 4px; font: 11px ui-monospace, Consolas, monospace; color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>Pecutan</h1>
      <p class="sub">Cambuk AI-mu biar kerjanya ngebut</p>
    </div>
  </header>

  <div class="card">
    <label class="row">
      <span>Cambuk aktif</span>
      <span class="switch"><input type="checkbox" id="enabled"><span></span></span>
    </label>
    <label class="row">
      <span>Suara</span>
      <span class="switch"><input type="checkbox" id="sound"><span></span></span>
    </label>
  </div>

  <div class="card stat">
    <div>
      <div class="label">Total cambukan</div>
      <div class="value" id="count">0</div>
    </div>
    <button class="link" id="reset" type="button">Reset</button>
  </div>

  <footer>
    <p><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>W</kbd> aktif/mati &nbsp; <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> suara</p>
    <p>Hanya di chatgpt.com dan claude.ai. <button class="link" id="shortcuts" type="button">Ubah shortcut</button></p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
